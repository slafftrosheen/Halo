let F,T0=[],cur=-1,th='dark';
function setup(name,theme){F=FILMS[name];th=theme||'dark';document.getElementById('lbl').innerHTML=F.label;let t=0;T0=F.scenes.map(s=>{const a=t;t+=s.d;return a});
 for(const id of ['A','B']){document.getElementById(id).className='ph '+th+' mint'};
 if(F.stage==='land'){document.documentElement.style.cssText='width:1920px;height:1080px';document.body.style.cssText='width:1920px;height:1080px';const fr=document.getElementById('frame');fr.style.width='960px';fr.style.height='600px';fr.style.top='120px';fr.style.transform='translateX(-50%) scale(1.45)';document.getElementById('lbl').style.top='34px';document.getElementById('wm').style.bottom='20px'}if(th==='light'){document.getElementById('stage').style.background='radial-gradient(900px 700px at 50% 38%,#ffffff 0%,#E9EAE0 75%)';document.getElementById('lbl').style.color='#060330';document.querySelector('#wm img').src='a/wm/halo_wordmark_light.svg'}
 return t}
function paint(el,s){el.classList.toggle('kid',/^K0/.test(s.id));['land','tabL','tabP'].forEach(c=>el.classList.remove(c));if(s.cls)el.classList.add(s.cls);el.innerHTML=R(s.id,s.st,th);el._s=s}
function sync(el,lt){
 el.getAnimations({subtree:true}).forEach(a=>{a.pause();a.currentTime=Math.max(0,lt)});
 const s=el._s;if(!s)return;
 if(s.words){el.querySelectorAll('.word').forEach((w,i)=>w.classList.toggle('on',lt>i*s.words+150))}
 if(s.kwords){const ws=el.querySelectorAll('.kword');const k=Math.floor((lt-200)/s.kwords);ws.forEach((w,i)=>{w.classList.remove('on','done','todo');w.classList.add(i<k?'done':i===k?'on':'todo')})}
 if(s.type){const ty=el.querySelector('.typed');if(ty){const n=Math.min(s.type.length,Math.floor(lt/38));ty.innerHTML=s.type.slice(0,n)+'<i></i>'}}
 el.querySelectorAll('.tap').forEach(x=>x.remove());el.querySelectorAll('.stopfx').forEach(x=>x.remove());
 if(s.tap&&lt>=s.tap.at&&lt<s.tap.at+450){const p=(lt-s.tap.at)/450,d=document.createElement('div');d.className='tap';d.style.left=s.tap.x+'px';d.style.top=s.tap.y+'px';d.style.transform=`scale(${.6+p*.9})`;d.style.opacity=1-p;el.appendChild(d)}
 if(s.stop&&lt<420){const p=lt/420,d=document.createElement('div');d.className='stopfx';d.innerHTML=[0,1,2].map(k=>`<i style="width:${(120+k*70)*(1-p*.7)}px;height:${(120+k*70)*(1-p*.7)}px;opacity:${(.7-k*.2)*(1-p)}"></i>`).join('')+`<b style="width:${26+p*20}px;height:${26+p*20}px;border-radius:8px;background:var(--text);opacity:${p<.8?1:(1-p)*5}"></b>`;el.appendChild(d)}
}
const XF=260;
function frame(t){
 let k=T0.length-1;for(let i=0;i<T0.length;i++){if(t<T0[i]+F.scenes[i].d){k=i;break}}
 const A=document.getElementById('A'),B=document.getElementById('B');
 if(k!==cur){ // swap: B keeps the outgoing scene for the crossfade
   if(cur>=0){B.innerHTML=A.innerHTML;B._s=A._s;B._t0=T0[cur];B.classList.toggle('kid',A.classList.contains('kid'))} paint(A,F.scenes[k]);cur=k}
 const lt=t-T0[k];
 sync(A,lt);
 if(k>0&&lt<XF){B.style.opacity=1-lt/XF;A.style.opacity=lt/XF;sync(B,t-B._t0)}else{B.style.opacity=0;A.style.opacity=1}
 // ambient stage light follows the screen's aura colour
 const au=A.querySelector('.aura,.edge');const amb=document.getElementById('amb');
 const c=A.querySelector('.aura.needs,.edge.att')?'rgba(255,159,107,.13)':A.querySelector('.aura.error')?'rgba(255,122,122,.08)':A.querySelector('.aura.listening,.aura.acting,.edge')?'rgba(12,242,186,.16)':'rgba(12,242,186,.07)';
 amb.style.background=`radial-gradient(closest-side,${c},transparent)`;
}
