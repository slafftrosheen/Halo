<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>halo — Learning + Voice &amp; Read everywhere · clickable prototype</title>
<link rel="stylesheet" href="halo-learning.css">
<style>
body{margin:0;background:#05021F;color:#FAFAF4;font-family:Atk,sans-serif;display:grid;grid-template-columns:300px 420px 1fr;height:100vh;overflow:hidden}
aside,main,section{overflow:auto}
aside{padding:22px 18px;border-right:1px solid rgba(250,250,244,.08)}
main{display:flex;flex-direction:column;align-items:center;padding:22px 0}
section{padding:22px 26px;border-left:1px solid rgba(250,250,244,.08)}
h1{font:600 20px Sora;margin:0 0 4px;letter-spacing:-.01em}h2{font:600 15px Sora;margin:18px 0 8px}
.k{font:700 10.5px Atk;letter-spacing:.18em;text-transform:uppercase;color:#0CF2BA;margin:16px 0 6px}
.mut{color:#B7B9D3}.s{font-size:13px}
button{font:600 13px Atk;border:0;border-radius:16px;padding:7px 12px;background:#1A1760;color:#FAFAF4;cursor:pointer;margin:0 4px 6px 0}
button.on{background:#0CF2BA;color:#060330}
.steps{list-style:none;padding:0;margin:0}.steps li{padding:8px 10px;border-radius:12px;font-size:13px;line-height:1.35;cursor:pointer;color:#B7B9D3}
.steps li.on{background:#1A1760;color:#FAFAF4}.steps li b{color:#0CF2BA;font-weight:700;margin-right:6px}
.frame{border-radius:36px;padding:10px;background:#1A1760;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.frame .ph{border-radius:28px}
.ph [data-go]{cursor:pointer}.ph [data-go]:hover{filter:brightness(1.04)}
.ev{margin-top:14px;font:600 12.5px ui-monospace,monospace;color:#0CF2BA;min-height:18px;text-align:center;max-width:380px}
.nav{margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:12.5px}td,th{border-bottom:1px solid rgba(250,250,244,.08);padding:6px 6px;vertical-align:top;text-align:left}th{color:#B7B9D3;font-weight:700}
code{font:12px ui-monospace,monospace;color:#B4E6D6}
.cue{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid rgba(250,250,244,.08)}
.cue .lp{width:84px;height:84px;border-radius:14px;background:#110E45}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;background:#1A1760;font-size:11.5px;margin:2px 4px 2px 0}
.cap{background:#1A1760;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.4;margin-top:10px;max-width:380px}
</style></head><body>
<aside>
 <h1>halo Learning</h1><div class="s mut">Kids + Study · Voice &amp; Read everywhere · DevKit v1.4</div>
 <div class="k">Journeys</div><div id="jbtn"></div>
 <ol class="steps" id="steps"></ol>
 <div class="k">All screens</div><div id="sbtn"></div>
</aside>
<main>
 <div><button id="thL" class="on">Light</button><button id="thD">Dark</button><button id="fs1" class="on">100%</button><button id="fs2">Large text</button><button id="anim" class="on">Motion on</button></div>
 <div class="frame"><div id="ph" class="ph kids light anim"></div></div>
 <div class="ev" id="ev"></div><div class="cap" id="cap"></div>
 <div class="nav"><button id="prev">← Back</button><button id="next">Next step →</button></div>
</main>
<section id="ann"></section>
<script src="icons.js"></script><script src="contract.js"></script><script src="screens.js"></script><script src="screens_vr.js"></script><script src="journeys.js"></script><script src="a/lottie_light.min.js"></script>
<script>
const C = HALO_CONTRACT, byId = Object.fromEntries(C.screens.map(s => [s.id, s]));
const STATES = {K00:['','listening','first','offline'],K10:['','listening'],K11:['','speaking','listening'],K12:['','speaking','listening','hesitate','correct','notyet','stopped'],K13:['','loading'],K14:['','saved'],
 H20:['searching','','perm'],H21:['reading',''],H22:['','hesitate','hint','listening','checking','stopped'],H23:['','notyet','solution'],C30:[''],C31:['','listening'],C32:['','noprovider'],C33:['','confirm'],C34:[''],
 S40:[''],S41:[''],S42:['','practice'],S43:[''],S44:['','revealed'],G90:['','offline','unavailable'],V01:['','listening','preview','model'],V02:['','sheet','inserted'],V03:['','reading','cmds'],V04:['','tap','form'],V05:['','secret'],V06:['','paused'],V07:['','cloud'],V08:[''],K15:['','pop'],K16:['','listening'],K17:[''],S45:[''],S46:['','compared'],S47:['listening','']};
let cur = {id:'K00', st:'', th:'light', fs:1, j:'A', k:0};
const LOT = { 'halo_learn_open':'learn_open','halo_learn_frame':'learn_frame','halo_learn_insight':'learn_insight','halo_learn_branch':'learn_branch','halo_learn_advance':'learn_advance','halo_learn_retry':'learn_retry',
  'bloom_kids':'bloom_kids','remember':'remember','draft_drawon':'draft_drawon','halo_fx_voice_field':'voice_field','halo_fx_read_aloud':'read_aloud','halo_fx_dictation_insert':'dictation_insert','halo_fx_voice_wave':'voice_wave','halo_fx_canvas_voice_add':'canvas_voice_add','halo_fx_kids_page_turn':'kids_page_turn','halo_fx_kids_word_pop':'kids_word_pop','halo_fx_listen_chapters':'listen_chapters','halo_fx_explain_back':'explain_back','trace':'trace_pulse_pill','Intent':'trace_pulse_pill' };
function lottieFor(anim){ for (const k in LOT) if (anim.includes(k)) return LOT[k]; return null; }
function render(){
  const ph = document.getElementById('ph'), mode = (cur.id[0]==="S"||cur.id[0]==="V") ? "study" : "kids";
  ph.className = `ph ${mode} ${cur.th} ${document.getElementById('anim').classList.contains('on') ? 'anim' : ''} ${cur.fs > 1 ? 'big' : ''}`;
  ph.style.setProperty('--fs', cur.fs);
  ph.innerHTML = SCREENS[cur.id](cur.st, cur.th);
  ph.querySelectorAll('[data-go]').forEach(el => el.addEventListener('click', e => { e.stopPropagation();
    const to = el.dataset.go, ev = el.dataset.ev; document.getElementById('ev').textContent = '⟶ ' + ev + (to !== 'self' ? '  →  ' + to : '');
    if (to !== 'self' && SCREENS[to]) { cur.id = to; cur.st = (STATES[to]||[''])[0] === 'searching' || (STATES[to]||[''])[0] === 'reading' ? (STATES[to])[0] : ''; render(); } }));
  annotate(); stepsUI();
}
function annotate(){
  const s = byId[cur.id]; if (!s) return;
  const a = document.getElementById('ann');
  a.innerHTML = `<div class="k">${s.id} · ${s.mode}</div><h1>${s.title}</h1><div class="s mut">Stage: ${s.stage}</div>
  <div class="k">States</div>${(STATES[cur.id]||['']).map(x => `<button class="${x===cur.st?'on':''}" data-st="${x}">${x||'primary'}</button>`).join('')}
  <div class="k">Visual hierarchy</div><div class="s">${s.hierarchy}</div>
  <div class="k">Today in the app</div><div class="s mut">${s.current}</div>
  <div class="k">Entry</div><div class="s">${s.entry.map(e=>`<span class="pill">${e}</span>`).join('')}</div>
  <div class="k">User action → halo event → new view</div><table><tr><th>Action</th><th>Event</th><th>To</th></tr>${s.exits.map(x=>`<tr><td>${x.action}</td><td><code>${x.event}</code></td><td><b>${x.to}</b></td></tr>`).join('')}</table>
  <div class="k">Components</div><div>${s.comps.map(c=>`<span class="pill">${c}</span>`).join('')}</div>
  <div class="k">Motion cues</div>${s.motion.map((m,i)=>{const l=lottieFor(m.animation);return `<div class="cue"><div class="lp" ${l?`data-l="${l}"`:''}></div><div class="s">
    <b>Trigger:</b> ${m.trigger}<br><b>Animation:</b> <code>${m.animation}</code><br><b>Scope:</b> ${m.scope}<br><b>Exit/cancel:</b> ${m.exit}<br><b>Fallback:</b> ${m.fallback}<br><b>Next action:</b> ${m.next_action}</div></div>`}).join('')}
  <div class="k">Accessibility</div><div class="s">${s.a11y.map(x=>`• ${x}`).join('<br>')}</div>
  <div class="k">Capability</div><div class="s mut">${s.capability}</div>`;
  a.querySelectorAll('[data-st]').forEach(b => b.onclick = () => { cur.st = b.dataset.st; render(); });
  a.querySelectorAll('[data-l]').forEach(el => { const n = el.dataset.l; window.lottie && lottie.loadAnimation({container:el,renderer:'svg',loop:true,autoplay:true,path:`a/lottie/halo_fx_${n}_dark.json`}); });
}
function stepsUI(){
  const J = JOURNEYS[cur.j]; document.getElementById('steps').innerHTML = J.steps.map((s,k)=>`<li class="${k===cur.k && s[0]===cur.id && s[1]===cur.st?'on':''}" data-k="${k}"><b>${s[0]}${s[1]?'·'+s[1]:''}</b>${s[2]}</li>`).join('');
  document.querySelectorAll('#steps li').forEach(li => li.onclick = () => gotoStep(+li.dataset.k));
  const s = J.steps[cur.k]; document.getElementById('cap').innerHTML = s && s[0]===cur.id && s[1]===cur.st ? `<b style="color:#0CF2BA">${J.title} · ${cur.k+1}/${J.steps.length}</b><br>${s[2]}<br><code>${s[3]}</code>` : `<span class="mut">Free exploring — tap anything in the phone.</span>`;
  document.querySelectorAll('#jbtn button').forEach(b => b.classList.toggle('on', b.dataset.j===cur.j));
}
function gotoStep(k){ const J = JOURNEYS[cur.j]; cur.k = Math.max(0, Math.min(J.steps.length-1, k)); const s = J.steps[cur.k]; cur.id = s[0]; cur.st = s[1]; document.getElementById('ev').textContent=''; render(); }
document.getElementById('jbtn').innerHTML = Object.keys(JOURNEYS).map(j=>`<button data-j="${j}">${JOURNEYS[j].title}</button>`).join('');
document.querySelectorAll('#jbtn button').forEach(b => b.onclick = () => { cur.j = b.dataset.j; gotoStep(0); });
document.getElementById('sbtn').innerHTML = C.screens.map(s=>`<button data-s="${s.id}">${s.id}</button>`).join('');
document.querySelectorAll('#sbtn button').forEach(b => b.onclick = () => { cur.id = b.dataset.s; cur.st = (STATES[cur.id]||[''])[0]; render(); });
const tog = (a,b,f) => { document.getElementById(a).onclick = () => { document.getElementById(a).classList.add('on'); document.getElementById(b).classList.remove('on'); f(); render(); }; };
tog('thL','thD',()=>cur.th='light'); tog('thD','thL',()=>cur.th='dark'); tog('fs1','fs2',()=>cur.fs=1); tog('fs2','fs1',()=>cur.fs=1.3);
document.getElementById('anim').onclick = e => { e.target.classList.toggle('on'); e.target.textContent = e.target.classList.contains('on') ? 'Motion on' : 'Reduced motion'; render(); };
document.getElementById('prev').onclick = () => gotoStep(cur.k-1); document.getElementById('next').onclick = () => gotoStep(cur.k+1);
gotoStep(0);
</script></body></html>
