<!doctype html><html><head><meta charset="utf-8"><title>halo · Package B + native assistant prototype</title><link rel="stylesheet" href="halo-app.css">
<style>body{margin:0;background:#05021F;color:#FAFAF4;font:15px Atk,sans-serif;display:flex;gap:28px;padding:24px;min-height:100vh;box-sizing:border-box}

#side .j.on{outline:2px solid #0CF2BA}select,button{font:14px Atk;background:#1A1760;color:#FAFAF4;border:0;border-radius:10px;padding:7px 10px;margin:3px 2px}

["Routines, apps & skills",["C03_list","C03_builder","C03_suggested","C03_history","C03_run-now","C02_list","C02_connect","C02_access","C01_list","C01_detail","C01_needs-access","N03_settings","N03_access-off"]],

["Advanced (Lab style)",["ST02_default","ST02_developer","I06_roles","I06_pick","X01_preview","X01_shared","X02_runtime","X02_vision-lab","X02_sandbox","VO06_compare","VO06_audio-test"]],
["Notifications",["N01_list","N01_filter","N02_detail","N02_reply","N02_confirm","N02_handed","N02_expired","N01_no-access"]]];
let S={id:'H01',st:'empty',th:'dark',acc:'mint',w:360,fs:1,flow:0,i:0},hist=[];
const $=q=>document.querySelector(q),log=m=>{$('#log').textContent=m+'\n'+$('#log').textContent};
function render(){const el=$('#ph');el.className='ph '+S.th+' '+S.acc+((/^K0/.test(S.id)||(S.id==='VA03'&&S.st==='kids-order'))?' kid':'')+(S.w==412?' w412':'')+(S.id==='XS01'&&S.st==='landscape'?' land':'')+(S.id==='SC09'?({'phone-land':' land','tablet-land':' tabL','night':' tabL','tablet-port':' tabP'}[S.st]||''):'')+(S.fs>=1.3?' big':'');el.style.setProperty('--fs',S.fs);el.innerHTML=SCREENS_B[S.id]?decorate(S.id,S.st,S.th,SCREENS_B[S.id](S.st,S.th)):SCR[S.id](S.st,S.th);if(window.drawFocus)drawFocus(el,S.id,S.st);
 $('#scr').value=S.id;fillSt();$('#st').value=S.st;document.querySelectorAll('.j').forEach((j,k)=>j.classList.toggle('on',k==S.flow));}
function go(id,st,push=true){if(push)hist.push([S.id,S.st]);S.id=id;S.st=st||STS[id][0];render();}
function fillSt(){$('#st').innerHTML=STS[S.id].map(s=>`<option>${s}</option>`).join('');}
$('#scr').innerHTML=Object.keys(SCR).map(k=>`<option>${k}</option>`).join('');
$('#journeys').innerHTML=FLOWS.map((f,k)=>`<span class="j" data-k="${k}">${f[0]}</span>`).join('');
document.querySelectorAll('.j').forEach(j=>j.onclick=()=>{S.flow=+j.dataset.k;S.i=0;const [id,st]=FLOWS[S.flow][1][0].split('_');go(id,st)});
$('#scr').onchange=e=>go(e.target.value);$('#st').onchange=e=>go(S.id,e.target.value);
$('#th').onclick=()=>{S.th=S.th=='dark'?'light':'dark';render()};$('#acc').onchange=e=>{S.acc=e.target.value;render()};
$('#w').onclick=()=>{S.w=S.w==360?412:360;render()};$('#fs').onclick=e=>{S.fs=S.fs==1?1.3:S.fs==1.3?2:1;e.target.textContent='Text '+Math.round(S.fs*100)+'%';render()};
const NAVMAP={home:['H01','conversation'],activity:['A01','all']};
$('#ph').onclick=e=>{const t=e.target.closest('[data-go],[data-ev]');
 if(t&&t.dataset.go){const g=t.dataset.go;log('tap → '+g);
  if(g=='back'){const h=hist.pop();if(h)go(h[0],h[1],false);return}
  if(NAVMAP[g]){go(...NAVMAP[g]);return}
  if(g=='settings'){go('ST01','top');return}
  if(g=='notebook'){go('NB01','hub');return}
  if(g=='devices'){go('D01','list');return}
  if([].includes(g)){log('(designed in Package '+(g=='notebook'?'C':g=='devices'?'F':'A/E')+')');return}
  if(g=='H02:mode'){go('H02','mode');return}
  if(SCR[g]){go(g);return}}
 if(t&&t.dataset.ev)log('event · '+t.dataset.ev);
 const f=FLOWS[S.flow][1];S.i=(f.indexOf(S.id+'_'+S.st)+1)%f.length;const [id,st]=f[S.i].split('_');go(id,st);};
render();
