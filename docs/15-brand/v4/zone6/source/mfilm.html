<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="z6.css"><link rel="stylesheet" href="m.css"><script src="icons.js"></script><script src="z6.js"></script><script src="m.js"></script>
<style>body{width:1920px;height:1080px;overflow:hidden;background:radial-gradient(50% 60% at 25% 50%,rgba(12,242,186,.08),transparent),#04021f}
.ph{position:absolute;left:250px;top:58px;transform:scale(1.13);transform-origin:top left}
.side{position:absolute;left:880px;top:170px;width:900px}
.k{font:700 15px Atk;letter-spacing:.14em;text-transform:uppercase;color:var(--mint)}
h2{font:600 60px/1.08 Sora;letter-spacing:-.03em;margin:18px 0 22px}
.dsc{font-size:25px;line-height:1.45;color:var(--t2);max-width:820px}
.mo{margin-top:30px;display:inline-flex;gap:10px;align-items:center;font:600 18px Atk;color:var(--cream);padding:12px 18px;border-radius:16px;background:rgba(12,242,186,.08);border:1px solid rgba(12,242,186,.3)}
.trk{position:absolute;left:880px;bottom:120px;display:flex;gap:10px}
.trk span{font:600 16px Atk;color:var(--t3);padding:10px 16px;border-radius:999px;background:rgba(250,250,244,.05);transition:all .3s}
.trk span.on{color:var(--ink);background:var(--mint)}.trk span.ap.on{background:var(--ap)}
.fade{transition:opacity .35s}
</style></head><body>
<div class="ph" id="ph"></div>
<div class="side fade" id="sd"><div class="k" id="k"></div><h2 id="t"></h2><div class="dsc" id="d"></div><div class="mo" id="m"></div></div>
<div class="trk" id="trk"></div>
<script>
const p=document.getElementById('ph');
p.innerHTML=`<div class="phone M st-idle"><div class="wall"></div>${sb}<div class="work"><div class="wh">${W.home()}</div><div class="wd">${W.draft()}</div></div>${zoneM('home','idle')}<div class="edge"></div><div class="gb"></div></div>`;
const TL=[
[0,'idle','Calm','Where you are, what you can do, where you can go','The bottom quarter reads top to bottom. The ring is always labelled “Talk”.','Idle · ring breathes 4.8 s'],
[3.2,'nav','Places','Everything, one tap away','Tap Places — or hold the ring. Every place — and your home-screen Widgets — springs out of the ring, with live status on each tile.','Spring · 600 ms · overshoot 1.56'],
[6.6,'idle','Calm','Back to work','The sheet folds back into the ring. Nothing moved while you were away.','Fold · 600 ms'],
[8.2,'listen','Listening','Tap the ring and just talk','The dock lifts into an island of live words. A soft mint light breathes around the screen edge.','Morph · 550 ms · edge breathe 2.4 s'],
[12.2,'work','Working','You see real steps — and one Stop','Progress comes from halo’s actual work, not a fake spinner.','Shimmer 1.4 s · step chip glow'],
[16.0,'need','Needs you','Apricot means halo is waiting for you','The island turns Apricot. The button names the action — “Send to Anna” — never just “Allow”.','Colour shift 400 ms · no motion loop'],
[20.0,'done','Done','A receipt, then calm','The check blooms once when the calendar confirms. Undo is right there.','Bloom 1.2 s × 2 · then still'],
[23.4,'idle','Calm','The dock settles','Buttons spring back out of the ring. Your work area never moved.','Spring back · staggered 40 ms'],
];
const names=[['idle','Calm'],['nav','Places'],['listen','Listening'],['work','Working'],['need','Needs you'],['done','Done']];
document.getElementById('trk').innerHTML=names.map(([s,n])=>`<span data-s="${s}" class="${s=='need'?'ap':''}">${n}</span>`).join('');
let cur=null,changed=0;const ph=p.firstChild;
window.frame=function(t){let s=TL[0];for(const x of TL)if(t>=x[0])s=x;
 if(s!==cur){cur=s;changed=t;ph.classList.remove('st-idle','st-nav','st-listen','st-work','st-need','st-done');ph.classList.add('st-'+s[1]);
  ph.querySelector('.ocell .cap').textContent=CAP[s[1]];
  k.textContent='halo · new look · '+s[2];t_.textContent=s[3];d.textContent=s[4];m.textContent=s[5];
  document.querySelectorAll('.trk span').forEach(e=>e.classList.toggle('on',e.dataset.s==s[1]));}
 const sd=document.getElementById('sd'); const a=Math.min(1,(t-changed)/0.35); sd.style.opacity=a;
 document.getAnimations().forEach(an=>{an.pause();const ct=(an instanceof CSSTransition)?(t-changed)*1000:t*1000;try{an.currentTime=ct}catch(e){}});
};
const k=document.getElementById('k'),t_=document.getElementById('t'),d=document.getElementById('d'),m=document.getElementById('m');
frame(0);
</script></body></html>
