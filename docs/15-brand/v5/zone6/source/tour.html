<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="z6.css"><link rel="stylesheet" href="m.css"><link rel="stylesheet" href="r.css"><script src="icons.js"></script><script src="z6.js"></script><script src="m.js"></script><script src="r.js"></script>
<style>body{width:1920px;height:1080px;overflow:hidden;background:radial-gradient(50% 60% at 25% 50%,rgba(12,242,186,.08),transparent),#04021f}
.sc{position:absolute;left:250px;top:58px;transform:scale(1.13);transform-origin:top left;opacity:0}
.side{position:absolute;left:880px;top:200px;width:900px}.k{font:700 15px Atk;letter-spacing:.14em;text-transform:uppercase;color:var(--mint)}
h2{font:600 60px/1.08 Sora;letter-spacing:-.03em;margin:18px 0 22px}.dsc{font-size:25px;line-height:1.45;color:var(--t2);max-width:820px}
.trk{position:absolute;left:880px;bottom:110px;display:flex;gap:8px;flex-wrap:wrap;width:960px}.trk span{font:600 15px Atk;color:var(--t3);padding:9px 14px;border-radius:999px;background:rgba(250,250,244,.05)}.trk span.on{color:var(--ink);background:var(--mint)}
.end{position:absolute;inset:0;display:grid;place-items:center;opacity:0;background:#04021f}.end .wm{font:600 140px Sora;letter-spacing:-.04em;display:flex;align-items:center;gap:4px}
.end p{font:500 30px Atk;color:var(--t2);text-align:center;margin-top:10px}
</style></head><body><div id="scs"></div>
<div class="side" id="sd"><div class="k" id="k"></div><h2 id="t"></h2><div class="dsc" id="d"></div></div><div class="trk" id="trk"></div>
<div class="end" id="end"><div><div class="wm">hal<svg viewBox="0 0 240 240" style="width:132px;height:132px;margin-top:22px"><path d="M197.32 87.18A84 84 0 1 1 152.82 42.68" stroke="#0CF2BA" stroke-width="30" stroke-linecap="round" fill="none"/></svg></div><p>Calm Dock, alive — the new look</p></div></div>
<script>
const HOMEPL={icon:'home',t:'Chat',s:'Private · on this phone',cls:'home'};
const flowWork=`<div class="wh">${W.home()}</div><div class="wd">${W.draft()}</div>`;
const SC=[
 {n:'Home',k:'Home',t:'Four plain starts',d:'Home greets you with one-tap starts. The message box and a labelled ring sit in the dock.',dur:3.6,html:ph(S.welcome,{place:{icon:'home',t:'Home',s:'Good morning · nothing waiting',cls:'home'},composer:'Ask or tell halo…',nav:'home',badge:0}),steps:[[0,'idle pre'],[0.4,'idle']]},
 {n:'Places',k:'Places',t:'Every place, one tap away',d:'Tap Places or hold the ring. Home, Workspace, Activity, Devices, Settings and your Widgets spring out of the ring.',dur:3.8,html:ph(W.home(),{place:HOMEPL,composer:'Message halo…',nav:'home'},`<div class="sheet glass"><div class="grab"></div><div class="sh">Places<small>hold the ring · or tap Places</small></div><div class="tiles">${tiles('Home')}</div><div class="prof">${I('privacy')}Private mode — everything stays on this phone<div class="t"></div></div></div>`),steps:[[0,'idle'],[0.7,'nav'],[3.1,'idle']]},
 {n:'Tools',k:'Workspace',t:'Library or Tools, right in the dock',d:'Five tools, big and named, each with its own colour and a one-line purpose.',dur:3.4,html:ph(S.tools,{place:{icon:'tool',t:'Tools',s:'5 tools · pick one'},seg:[['list_view','Library'],['tool','Tools',1]],acts:[['history','Recent']],nav:'work'}),steps:[[0,'idle pre'],[0.3,'idle']]},
 {n:'HaloStudio',k:'In a tool',t:'Where you are, what you can do',d:'Tool, file and real save state on top. Four big labelled buttons spring out of the ring — the likely next one is filled.',dur:3.8,html:ph(W.studio(),{place:{icon:'draw',t:'Poster draft',s:'HaloStudio · '+ok('Saved')},next:['guide_me','Next: add a title'],acts:[['add','Add',1],['draw','Draw'],['group','Layers'],['more','More']],nav:'work'}),steps:[[0,'idle pre'],[0.4,'idle']]},
 {n:'Listening',k:'Voice',t:'Tap the ring and just talk',d:'The dock lifts into an island of live words with a Stop button. A soft light breathes around the edge.',dur:3.6,html:`<div class="phone M st-idle"><div class="wall"></div>${sb}<div class="work">${flowWork}</div>${zoneM('home','idle')}<div class="edge"></div><div class="gb"></div></div>`,flow:1,steps:[[0,'idle'],[0.5,'listen']]},
 {n:'Working',k:'Working',t:'Real steps, one Stop',d:'Progress comes from halo’s actual work — never a fake spinner.',dur:3.4,flowNext:1,steps:[[0,'work']]},
 {n:'Needs you',k:'Needs you',t:'Apricot means halo is waiting for you',d:'The button names the action — “Send to Anna”. Nothing is sent until you tap.',dur:3.6,flowNext:1,steps:[[0,'need']]},
 {n:'Done',k:'Done',t:'A receipt, then calm',d:'“Added” appears only after the calendar confirms. Undo is right there.',dur:3.4,flowNext:1,steps:[[0,'done'],[2.6,'idle']]},
 {n:'Activity',k:'Activity',t:'What happened, what’s waiting',d:'Needs you · Running · Done live in the dock, with a count on what needs you.',dur:3.4,html:ph(S.activity,{place:{icon:'notifications',t:'Activity',s:'2 need you · 1 running'},seg:[['approval','Needs you',1,'2'],['retry','Running'],['check','Done']],nav:'act'}),steps:[[0,'idle pre'],[0.3,'idle']]},
 {n:'Errors',k:'Recovery',t:'Say what failed — and fix it',d:'A soft red island names the operation, says your draft is safe and offers the matching fix.',dur:3.6,html:ph(W.studio(),{place:{icon:'draw',t:'Poster draft',s:'HaloStudio · '+ok('Saved')},acts:[['add','Add',1],['draw','Draw'],['group','Layers'],['more','More']],nav:'work',
   island:{cls:'err',r1:`<div class="bd">${I('failure')}</div><div><div class="tt">Couldn’t export as JPEG</div><div class="ts">Your draft is safe · the image is too large</div></div>`,r2:`<div class="btn">Smaller size</div><div class="btn p">Export PNG</div>`}}),steps:[[0,'idle'],[0.6,'err']]},
 {n:'Kids',k:'Kids',t:'Same dock, bigger and warmer',d:'56dp buttons, a warm ring, only Home and Learn, never more than three choices.',dur:3.4,html:ph(S.kidsHome,{kid:1,place:{icon:'home',t:'Hi Mila',s:'Kids · a grown-up is nearby'},acts:[['heading','Type',1],['guide_me','Help']],nav:'home'}),steps:[[0,'idle pre'],[0.3,'idle']]},
];
let html='',t0=0;
SC.forEach((s,i)=>{s.t0=t0;t0+=s.dur;if(s.html){html+=`<div class="sc" id="sc${i}">${s.html}</div>`;s.el=i}else s.el=SC[i-1].el});
const END=t0; window.TOTAL=END+2.5;
document.getElementById('scs').innerHTML=html;
document.getElementById('trk').innerHTML=SC.map((s,i)=>`<span data-i="${i}">${s.n}</span>`).join('');
let last={};
window.frame=function(t){
 if(t>=END){document.getElementById('end').style.opacity=Math.min(1,(t-END)/.5);}
 let i=SC.findIndex(s=>t>=s.t0&&t<s.t0+s.dur); if(i<0)i=SC.length-1; const s=SC[i];
 document.querySelectorAll('.sc').forEach(e=>{const idx=+e.id.slice(2);const own=SC[idx];const vis=(idx===s.el);
  let o=0;if(vis){const st=SC[idx].t0, lt=t-st; o=Math.min(1,lt/.35)}
  e.style.opacity=o});
 // state of active phone
 let cls='idle';const lt=t-s.t0;for(const [at,c] of s.steps) if(lt>=at) cls=c;
 const phEl=document.querySelector('#sc'+s.el+' .phone');
 const key=s.el+':'+cls;
 if(last[s.el]!==key){last[s.el]=key;last['t'+s.el]=t;
  phEl.classList.remove('st-idle','st-nav','st-listen','st-work','st-need','st-done','st-err','pre');cls.split(' ').forEach(c=>phEl.classList.add(c=='pre'?'pre':'st-'+c));
  const cap=phEl.querySelector('.ocell .cap'); if(cap&&!phEl.classList.contains('kid')) cap.textContent=CAP[cls.split(' ')[0]]||'Talk';}
 const sd=document.getElementById('sd');sd.style.opacity=Math.min(1,lt/.35)*(t>=END?0:1);
 k.textContent='halo · new look · '+s.k;tt.textContent=s.t;dd.textContent=s.d;
 document.querySelectorAll('.trk span').forEach(e=>e.classList.toggle('on',+e.dataset.i===i));
 document.getAnimations().forEach(an=>{an.pause();let ct;if(an instanceof CSSTransition){const ph=an.effect&&an.effect.target&&an.effect.target.closest&&an.effect.target.closest('.sc');const id=ph?+ph.id.slice(2):s.el;ct=(t-(last['t'+id]||0))*1000}else ct=t*1000;try{an.currentTime=ct}catch(e){}});
};
const k=document.getElementById('k'),tt=document.getElementById('t'),dd=document.getElementById('d');
CAP.err='Talk';
frame(0);
</script></body></html>
