<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="z6.css"><link rel="stylesheet" href="th.css"><script src="icons.js"></script><script src="z6.js"></script><script src="th.js"></script>
<style>.gridA{display:grid;grid-template-columns:150px repeat(6,1fr);gap:22px 18px;align-items:center}

const KS=Object.keys(ACC);
if(q=='2'){
 const grid=`<div class="panel" style="background:#0b0838"><div class="gridA"><div></div>${KS.map(k=>`<div class="h" style="text-align:center">${ANAME[k]}</div>`).join('')}

 <div class="h">Launcher shapes</div>${[['circle','MINT'],['squircle','LILAC'],['rounded','SAGE']].map(([s,k])=>`<div class="c">${appIcon('dark',k,84,s)}${s}</div>`).join('')}<div class="c">${appIcon('mono','MINT',84)}System themed</div><div class="c">${appIcon('light','CORAL',84,'circle')}circle · light</div><div></div>
 </div></div>`;
 const T=TONES.dark.SLATE;
 const home=`<div class="hs2" style="background:radial-gradient(90% 60% at 80% 10%,#2b4a6a,transparent 60%),linear-gradient(160deg,#1a2a3a,#0b1220)">

 document.getElementById('root').innerHTML=`<div class="boardpg"><div class="bh"><div><div class="k">halo · new look · Make it yours · 2 / 3</div><h1>The app icon follows your look</h1>
