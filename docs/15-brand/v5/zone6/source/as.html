<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="z6.css"><link rel="stylesheet" href="m.css"><link rel="stylesheet" href="r.css"><link rel="stylesheet" href="as.css"><script src="icons.js"></script><script src="z6.js"></script><script src="m.js"></script></head>
<body><div id="root"></div><script>
const b=new URLSearchParams(location.search).get('b')||'1';
const wm=`<div class="wm">hal<svg viewBox="0 0 240 240" style="width:30px;height:30px;margin-top:4px"><path d="M197.32 87.18A84 84 0 1 1 152.82 42.68" stroke="#0CF2BA" stroke-width="30" stroke-linecap="round" fill="none"/></svg></div>`;
const sbD=`<div class="sb" style="color:#1d1f24"><span>9:41</span><span class="r"><i style="background:#1d1f24"></i><i style="background:#1d1f24"></i><i style="background:#1d1f24"></i></span></div>`;
const H={
msg:`<div class="host"><div class="hb"><div class="av"></div>Anna</div><div class="bub l">Are you still coming to the market?</div><div class="bub r">Yes! Leaving soon</div><div class="bub l">Bring the price cards 🙏</div></div>`,
map:`<div class="host"><div class="map"><div class="rd" style="left:0;right:0;top:300px;height:18px"></div><div class="rd" style="left:150px;width:18px;top:0;bottom:0"></div><div class="rd" style="left:0;right:0;top:470px;height:12px;transform:rotate(-12deg)"></div><div class="pin" style="left:200px;top:250px"></div><div class="sbar">Riga Central Market</div></div></div>`,
art:`<div class="host"><div class="art"><h3>First frost expected this weekend across Latvia</h3><div style="color:#777;font-size:14px">Weather desk · 1 h ago</div><div class="im"></div><p>Temperatures are expected to drop below zero on Saturday night, with clear skies in Riga and light winds along the coast…</p></div></div>`,
home:`<div class="host" style="background:radial-gradient(90% 60% at 80% 10%,#2b4a6a,transparent 60%),linear-gradient(160deg,#1a2a3a,#0b1220)"><div style="position:absolute;top:70px;left:30px;font:300 64px/1 Sora;color:#fff;letter-spacing:-.04em">9:41<div style="font:500 16px Atk;margin-top:8px;opacity:.8">Friday, 20 November</div></div></div>`,
};
const cx=(i,t,on)=>`<span class="cx ${on?'on':''}">${I(i)}${t}</span>`;
function island(o){return `<div class="asi ${o.cls||''}"><div class="ctx">${o.ctx||''}</div><div class="st" aria-live="polite">${o.st}</div>${o.dt?`<div class="dt">${o.dt}</div>`:''}${o.body||''}
 <div class="bot"><div class="btn ${o.lp||''}" style="justify-self:start;width:100%">${o.left||'Close'}</div><div class="oc">${orb()}<div class="cap" style="color:${o.capc||'var(--cream)'}">${o.cap||'Talk'}</div></div><div class="btn" style="justify-self:end;width:100%">${I('open_app')}Open halo</div></div></div>`}
function phoneAS(host,over,o={}){return `<div class="phone ${o.st?'st-'+o.st:''}" style="background:#F4F5F7">${H[host]}${host=='home'?sb:sbD}${o.scrim?'<div class="hscrim"></div>':''}${o.sweep?'<div class="sweep"></div>':''}${over}${o.edge?`<div class="edge2 ${o.edge=='ap'?'ap':''}"></div>`:''}<div class="gb" style="background:rgba(30,30,40,.5)"></div></div>`}
const stopBtn=`${I('stop')}Stop`;
const A=[
['msg',island({ctx:cx('send','In Messages')+cx('camera','Screen included',1),st:'Listening',dt:'Go ahead, I’m listening.',body:`<div class="words" style="margin-top:10px">Tell Anna I’ll bring <span class="n">the price cards…</span></div><div style="margin-top:8px">${wave(14)}</div>`,left:stopBtn,lp:'stop',cap:'Listening',capc:'var(--mint)'}),{st:'listen',edge:1,scrim:1,sweep:1},'1 · Invoke + listening','sweep from the bottom, live words'],
['art',island({ctx:cx('read_mode','In Browser')+cx('camera','Screen included',1),st:'Thinking',dt:'Reading this page with you…',body:`<div class="steps" style="margin-top:12px;display:flex;gap:6px">${['Read page','Check weather','Answer'].map((s,i)=>`<span class="cx ${i==1?'on':''}" style="height:36px">${I(i==0?'check':i==1?'search':'speaker')}${s}</span>`).join('')}</div>`,left:stopBtn,lp:'stop',cap:'Working',capc:'var(--mint)'}),{scrim:1,edge:1},'2 · Thinking','real steps, screen chip'],
['map',island({ctx:cx('open_app','In Maps'),st:'The market closes at 18:00',body:`<div class="ans">Riga Central Market is open today 7:00–18:00. It’s a 12-minute walk from you.</div><div class="dact"><span>${I('open_app')}Directions in Maps</span><span>${I('reminder')}Remind me at 17:00</span></div>`,left:'Close',cap:'Tap to stop'}),{scrim:1},'3 · Answer + app actions','speaks, offers real app actions'],
['msg',island({cls:'need',ctx:cx('send','In Messages'),st:'Send this to Anna?',body:`<div class="ans" style="padding:12px 14px;border-radius:16px;background:rgba(255,159,107,.08)">“I’ll bring the price cards — see you at 10!”</div><div class="from">${I('approval')}Messages is asking · nothing sent yet</div><div class="need2"><div class="btn">Not now</div><div class="btn" style="background:var(--ap);color:#060330;border:0">${I('send')}Send to Anna</div></div>`,left:'Close',cap:'Waiting for you',capc:'var(--ap)'}),{scrim:1,edge:'ap'},'4 · An app asks to confirm','Apricot, button names the action'],
['map',island({ctx:cx('open_app','In Maps'),st:'Which market?',dt:'Maps found three. Say the number or tap.',body:`<div class="opts">${[['Central Market','Prāgas iela · 12 min'],['Kalnciema Quarter','Sat only · 25 min'],['Āgenskalns Market','16 min']].map(([a,s],i)=>`<span><b style="margin:0;color:var(--mint);font-size:15px">${i+1}</b>${a}<b>${s}</b></span>`).join('')}</div>`,left:'Close',cap:'Listening',capc:'var(--mint)'}),{scrim:1,edge:1},'5 · Pick an option','numbered, voice or tap'],
['home',island({cls:'err',ctx:'',st:'I couldn’t reach the online helper',dt:'Your question is kept. On-phone answers still work.',body:`<div class="dact"><span>${I('retry')}Try on this phone</span><span>${I('open_app')}Check in halo</span></div>`,left:'Close',cap:'Talk'}),{scrim:1},'6 · Problem, with the fix','says what failed + what still works'],
];
const M=[
['msg',`<div class="bubble" style="right:12px;top:300px">${orb()}</div><div class="bubble lbl" data-l="Listening" style="right:12px;top:380px;box-shadow:0 0 0 3px rgba(12,242,186,.6),0 0 24px rgba(12,242,186,.5)">${orb()}</div><div class="bubble lbl" data-l="Working" style="right:12px;top:460px"><svg class="arc" viewBox="0 0 68 68"><circle cx="34" cy="34" r="32" stroke="rgba(12,242,186,.2)" stroke-width="3" fill="none"/><path d="M34 2a32 32 0 0 1 32 32" stroke="#0CF2BA" stroke-width="3" stroke-linecap="round" fill="none"/></svg>${orb()}</div><div class="bubble lbl" data-l="Needs you" style="right:12px;top:540px">${orb()}<span class="dot"></span></div>`,{},'Bubble states','idle · listening · working · needs you'],
['home',`<div class="mini"><div class="mh"><div><div class="wmk">mini halo</div><div class="sub2">A quick question · private</div></div><div class="x"><span class="ib">${I('open_app')}</span><span class="ib">${I('close')}</span></div></div>
 <div class="sugs">${['What’s on today?','Weather tomorrow','Set a 10-min timer'].map(s=>`<span>${s}</span>`).join('')}</div>
 <div class="cmp"><div class="fld">Ask halo…</div><div style="display:flex;flex-direction:column;align-items:center;gap:2px">${orb()}<div class="cap" style="font-size:12px">Talk</div></div></div></div>`,{},'Mini halo · ready','suggestions, type or talk'],
['home',`<div class="mini" style="border-color:rgba(12,242,186,.35)"><div class="mh"><div><div class="wmk">mini halo</div><div class="sub2">Answered · on this phone</div></div><div class="x"><span class="ib">${I('open_app')}</span><span class="ib">${I('close')}</span></div></div>
 <div class="rsp"><div class="who">${I('check')}halo</div>Tomorrow in Riga: 1° and clear in the morning, 5° by afternoon. Wear a warm layer for the market.</div>
 <div class="sugs"><span>${I('speaker').replace('class="i"','class="i" style="width:16px;height:16px;margin-right:6px"')}Read aloud</span><span>Continue in halo</span></div>
 <div class="cmp"><div class="fld">Ask a follow-up…</div><div style="display:flex;flex-direction:column;align-items:center;gap:2px">${orb()}<div class="cap" style="font-size:12px">Talk</div></div></div></div>`,{},'Mini halo · answer','follow-up in place'],
['home',`<div class="mini" style="border-color:rgba(255,159,107,.7);box-shadow:0 0 0 4px rgba(255,159,107,.1),0 24px 60px rgba(0,0,0,.5)"><div class="mh"><div><div class="wmk">mini halo</div><div class="sub2" style="color:var(--ap)">Needs your review</div></div><div class="x"><span class="ib">${I('close')}</span></div></div>
 <div class="rsp" style="background:rgba(255,159,107,.08)"><div class="who" style="color:var(--ap)">${I('approval')}Waiting for you</div>halo drafted a message to Anna. Nothing is sent until you look.</div>
 <div class="need2" style="display:flex;gap:8px;margin-top:12px"><div class="btn" style="flex:1;height:50px">Not now</div><div class="btn" style="flex:1;height:50px;background:var(--ap);color:#060330;border:0">${I('approval')}Review</div></div></div>`,{edge:'ap'},'Mini halo · needs you','Review opens Activity'],
];
const sets={'1':{k:'Android assistant · 1 / 2',t:'The halo assistant, over any app',p:'Hold the home button (or say the wake phrase) and halo rises as one island from the bottom — the same ring, caption and bottom order as the dock: Stop · ring · Open halo. The app underneath stays visible.',ph:A.slice(0,3),
 n:[['Same grammar as the app','Ring centred at the bottom with its caption, Stop on the left, Open halo on the right — muscle memory carries over.'],['Context you can see','“In Messages” and a “Screen included” chip — so you always know what halo is looking at.'],['Real app actions','When the app offers actions (directions, reminders), they appear as chips — never invented.'],['Edge light = listening','The screen edge breathes while halo listens and stops when it doesn’t.']]},
 '2':{k:'Android assistant · 2 / 2',t:'When an app asks, and when things go wrong',p:'App confirmations and choices (Android voice requests) become halo moments instead of plain system dialogs: Apricot when something waits for you, numbered options for voice, and an honest problem state with what still works.',ph:A.slice(3),
 n:[['Apricot means waiting','The island and screen edge turn Apricot; the app’s name is shown; nothing happens until you tap.'],['Buttons name the action','“Send to Anna”, never “OK” or “Allow”.'],['Say the number','Options are numbered so you can answer by voice — or tap a 50dp row.'],['Problems keep your question','The failure says what didn’t work and what still does, with one fix.']]},
 '3':{k:'Mini halo',t:'mini halo — a small halo that floats',p:'The floating bubble is a tiny ring that shows halo’s real state at a glance. Tap it for mini halo: a compact island with suggestions, a message box and the ring — answer, follow up, or hand over to the full app.',ph:M,
 n:[['A ring, not a button','The bubble is the halo ring: breathing when idle, glowing when listening, an arc when working, an Apricot dot when something needs you.'],['Quick, then gone','Suggestions, type or talk, follow-ups in place. Close keeps the conversation in halo.'],['Hand over in one tap','Open halo continues the same conversation in the full app.'],['Lowercase, everywhere','“mini halo”, “Ask halo”, “Open halo” — the current “Mini Halo / Ask Halo / Open Halo” strings are lowercased.']]}};
const d=sets[b];
document.getElementById('root').innerHTML=`<div class="boardpg"><div class="bh"><div><div class="k">halo · new look · ${d.k}</div><h1>${d.t}</h1><p>${d.p}</p></div>${wm}</div>
<div class="phones">${d.ph.map(([h,ov,o,l,sm])=>`<div class="pcol">${phoneAS(h,ov,o)}<div class="pl">${l}<small>${sm}</small></div></div>`).join('')}</div>
<div class="notes">${d.n.map(([h,p])=>`<div class="note"><b>${h}</b><p>${p}</p></div>`).join('')}</div></div>`;
</script></body></html>
