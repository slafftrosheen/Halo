<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="z6.css"><link rel="stylesheet" href="m.css"><link rel="stylesheet" href="r.css"><link rel="stylesheet" href="r2.css"><link rel="stylesheet" href="r3.css"><link rel="stylesheet" href="r4.css"><link rel="stylesheet" href="alive.css"><script src="icons.js"></script><script src="z6.js"></script><script src="m.js"></script><script src="r.js"></script><script src="r2.js"></script><script src="r3.js"></script><script src="r4.js"></script><script src="alive.js"></script>
<style>body{width:1600px;height:1000px;overflow:hidden;background:radial-gradient(60% 60% at 50% 0%,rgba(201,184,255,.08),transparent),#04021f}
#root{position:absolute;inset:0}
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 90px}
.slot{width:390px;height:844px;position:relative;zoom:.98}
.slot>.phone{position:absolute;inset:0}
.mid{width:520px;text-align:center}.mid .k{font:700 15px Atk;letter-spacing:.16em;color:var(--lil);text-transform:uppercase}
.mid h2{font:600 44px/1.1 Sora;letter-spacing:-.02em;margin:14px 0 10px}.mid p{font-size:20px;line-height:1.5;color:var(--t2);min-height:90px}
.lst{margin:26px auto 0;display:flex;flex-direction:column;gap:10px;width:360px;text-align:left}
.lst div{display:flex;align-items:center;gap:12px;font:600 18px Atk;color:var(--t3);padding:8px 14px;border-radius:14px}
.lst div i{width:12px;height:12px;border-radius:50%;background:currentColor;display:block}
.lst div.on{background:rgba(250,250,244,.06);color:var(--cream)}
.lst div.on i{box-shadow:0 0 12px currentColor}
.top3{position:absolute;top:40px;left:0;right:0;text-align:center}.top3 .k{font:700 15px Atk;letter-spacing:.16em;color:var(--lil);text-transform:uppercase}
.top3 h2{font:600 40px/1.1 Sora;letter-spacing:-.02em;margin-top:10px}.top3 p{font-size:19px;color:var(--t2);margin-top:8px}
.row3{position:absolute;top:228px;left:0;right:0;display:flex;justify-content:center;gap:70px}
.row3 .slot{zoom:.84}
.row3 .lb{position:absolute;bottom:-44px;left:0;right:0;text-align:center;font:600 21px Sora}
.tap{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,.9);background:rgba(255,255,255,.22);z-index:60;pointer-events:none}
.bloom{position:absolute;border-radius:50%;z-index:59;pointer-events:none}
.end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.end h1{font:600 64px/1.05 Sora;letter-spacing:-.03em;margin-top:26px}.end p{font-size:22px;color:var(--t2);margin-top:14px}
.chips{display:flex;gap:12px;margin-top:30px}.chips span{padding:12px 20px;border-radius:999px;font:600 18px Atk;background:rgba(250,250,244,.06)}
</style></head><body><div id="root"></div><script>
const ease=k=>k<0?0:k>1?1:1-Math.pow(1-k,3);const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const tap=(x,y,p)=>p<0||p>1?'':`<div class="tap" style="left:${x-28*(0.6+.8*p)}px;top:${y-28*(0.6+.8*p)}px;width:${56*(0.6+.8*p)}px;height:${56*(0.6+.8*p)}px;opacity:${1-p}"></div>`;
const bloom=(x,y,p,c='12,242,186')=>p<0||p>1?'':`<div class="bloom" style="left:${x-20-160*p}px;top:${y-20-160*p}px;width:${40+320*p}px;height:${40+320*p}px;background:rgba(${c},${.45*(1-p)})"></div>`;
const mid=(k,h,p,extra='')=>`<div class="mid"><div class="k">${k}</div><h2>${h}</h2><p>${p}</p>${extra}</div>`;
const slot=(html,lbl='')=>`<div class="slot">${html}${lbl}</div>`;
function inject(html,extra){return html.replace(/<div class="gb"><\/div><\/div>$/,extra+'<div class="gb"></div></div>')}
const SC=[
[0,9,t=>{const tod=.2+.75*cl(t/8.5);return `<div class="top3"><div class="k">halo · make it yours, alive</div><h2>Six live wallpapers that breathe</h2><p>Built from the halo ring and your look. Tide and Day Arc follow the time of day.</p></div>
 <div class="row3">${slot(home('aurora',{layout:'std',tod:.8,sec:(t*7)%60}),'<div class="lb">Aurora</div>')}${slot(home('tide',{layout:'learn',tod,lf:.6}),`<div class="lb">Tide · ${tod<.35?'morning':tod<.6?'day':tod<.82?'evening':'night'}</div>`)}${slot(home('dayarc',{layout:'min',tod,sec:(t*7)%60}),'<div class="lb">Day Arc</div>')}</div>`}],
[9,19.5,t=>{const lt=t-9;const st=lt<2.2?'idle':lt<5?'listen':lt<7.6?'work':'need';const amt=st=='idle'?0:cl((lt-(st=='listen'?2.2:st=='work'?5:7.6))/.6);
 const tod=[.27,.5,.74,.95][Math.min(3,Math.floor(lt/2.6))];const tags={listen:['Listening',''],work:['Working · step 2 of 3',''],need:['Needs you · Reply to Anna','ap']};
 const L=ph(SA.picker('aurora',tod),{place:{icon:'wallpaper',t:'Wallpaper',s:'Previewing Aurora'},acts:[['undo','Undo'],['check','Apply',1]],nav:'places'});
 const R=home('constellation',{layout:'std',state:st=='idle'?null:st,amt,need:st=='need',sec:(t*7)%60,tag:st=='idle'?'':tags[st][0],tagc:st=='idle'?'':tags[st][1],over:'',listen:0});
 const I2=[['Idle','#8E8FB5','idle'],['Listening · mint ripples','#0CF2BA','listen'],['Working · links light up','#0CF2BA','work'],['Needs you · Apricot glow','#FF9F6B','need']];
 return `<div class="stage">${slot(L)}${mid('wallpaper reacts to halo','Same colours, same meaning','The home screen tells you what halo is doing — mint while it listens or works, Apricot only when something needs you.',`<div class="lst">${I2.map(([a,c,k])=>`<div class="${k==st?'on':''}" style="${k==st?'color:'+c:''}"><i></i><span style="color:${k==st?'var(--cream)':'inherit'}">${a}</span></div>`).join('')}</div>`)}${slot(R.replace('class="w2 ask','class="w2 ask'))}</div>`}],
[19.5,30.5,t=>{const lt=t-19.5;const taskPh=cl((lt-1)/2.2),dayPh=ease(cl((lt-4)/1)),lf=.6+.2*ease(cl((lt-6.2)/.9)),bl=cl((lt-6.9)/.9),wPh=cl((lt-8.4)/.5);
 const cap=lt<3.8?['Tasks','Done → struck → tucked away']:lt<6.1?['Your day','Something new slides in, in mint']:lt<8.3?['Learn','The lesson ring fills one step']:['Weather','Fresh data crossfades, “updated” in mint'];
 const L=home('aurora',{layout:'std',tod:.8,taskPh,dayPh,sec:(t*7)%60});const R=home('drift',{layout:'learn',lf,bloom:bl>0&&bl<1?bl:0,wPh,dayPh:0});
 const tp=tap(54,477,cl((lt-.9)/.6));
 return `<div class="stage">${slot(inject(L,tp))}${mid('widgets that move with meaning',cap[0],cap[1]+'. One motion per change — if nothing changed, the widget is still.',`<div class="lst" style="width:300px">${['Full · springs','Gentle · fades','Still · instant'].map((x,i)=>`<div class="${i==0?'on':''}" style="${i==0?'color:#0CF2BA':''}"><i></i>${x}</div>`).join('')}</div>`)}${slot(R)}</div>`}],
[30.5,39,t=>{const lt=t-30.5;const sel=lt<1.8?-1:0;const k=ease(cl((lt-2.1)/.9));const applied=lt>5.2;
 const L=ph(SA.withme(sel),{place:{icon:'guide_me',t:'Do it with me',s:'Question 2 of 3'},acts:[['undo','Back'],['speaker','Read aloud'],['check','This one',1]],nav:'places'});
 const before=home('paper',{layout:'std',sec:24}),after=home('aurora',{layout:'std',tod:.8,sec:24,tag:applied?'Applied · Put back any time':'Previewing'});
 const R=`<div style="position:absolute;inset:0;opacity:${1-k}">${before}</div><div style="position:absolute;inset:0;opacity:${k}">${after}</div>${bloom(195,560,cl((lt-5.2)/.9))}`;
 const cap=lt<2.1?['Do it with me','Three questions with two pictures each. Every answer can be read aloud.']:lt<5.2?['Live on the whole phone','Pick by picture, not by setting. Nothing sticks until Apply.']:['Apply — or put it back','“Put back how it was” keeps 7 days of changes, in plain words.'];
 return `<div class="stage">${slot(inject(L,tap(110,300,cl((lt-1.4)/.6))+tap(300,742,cl((lt-4.7)/.6))))}${mid('make it yours',cap[0],cap[1])}${slot(R)}</div>`}],
[39,47.5,t=>{const lt=t-39;const coach=(n,tx,x,y,ax,i)=>{const p=ease(cl((lt-.4-i*.45)/.4));return p<=0?'':`<div class="glc dn" style="left:${x}px;top:${y}px;--ax:${ax}px;opacity:${p};transform:translateY(${(1-p)*10}px) scale(${.9+.1*p})"><i>${n}</i>${tx}</div>`};
 const L=ph(S.welcome,{place:{icon:'home',t:'Home',s:'Show me · 5 things on this screen'},acts:[['close','Stop showing'],['speaker','Read all',1]],nav:'home'},coach(1,'Ideas to start — tap one',30,128,18,0)+coach(2,'Note & camera',20,600,18,1)+coach(3,'Hold to talk',138,706,52,2)+coach(4,'Home',14,728,18,3)+coach(5,'Places',266,728,76,4));
 const hp=(lt%2.4)/2.4;const press=hp>.25&&hp<.75;const hy=752+(press?6:0)+(hp<.25?(1-hp/.25)*40:0);const cardP=ease(cl((lt-3.2)/.6));
 const R=ph(S.welcome,{place:{icon:'home',t:'Home',s:press?'Listening':'Ready'},acts:[['new_note','Note'],['camera','What’s this?']],nav:'home',state:press?'listen':'idle'},`<div class="hole" style="left:157px;top:734px;width:76px;height:76px;transform:scale(${press?1.08:1})"></div><svg class="hand" viewBox="0 0 54 54" style="left:190px;top:${hy}px;opacity:${cl(hp/.12)}"><circle cx="20" cy="14" r="${press?16:10}" fill="rgba(201,184,255,${press?.5:.3})"/><path d="M17 30V13a3 3 0 0 1 6 0v12m0-3a3 3 0 0 1 6 0v3m0-1a3 3 0 0 1 6 0v3m0-1a3 3 0 0 1 6 0v8c0 7-5 12-12 12h-2c-5 0-8-2-11-6l-6-8a3 3 0 0 1 4.5-4L17 34" fill="#FAFAF4" stroke="#1b1446" stroke-width="2" stroke-linejoin="round"/></svg>
 <div class="coachcard" style="top:420px;opacity:${cardP};transform:translateY(${(1-cardP)*24}px)"><div class="k2">Show me · 1 of 3</div><b>Hold the ring to talk</b><p>Press and keep your finger on the ring. Speak. Let go when you’re done.</p><div class="cbtns"><span>${I('retry')}Again</span><span>${I('play')}Do it for me</span><span class="p">${I('check')}Got it</span></div></div>`);
 const cap=lt<3.2?['Show me','Every control gets a lilac name. halo can read them all aloud.']:lt<6?['Watch, then try','A hand shows the gesture once. “Do it for me” does it for you.']:['No age. No test.','Just “How much help would you like?” — Easy view for anyone, set up by family if needed.'];
 return `<div class="stage">${slot(L)}${mid('guidance for every age',cap[0],cap[1])}${slot(R)}</div>`}],
[47.5,52,t=>`<div class="end"><div style="width:120px;height:120px;transform:rotate(${(t-47.5)*20}deg)">${hring(120)}</div><h1>Make it yours, alive</h1><p>Customise with a guide · six live wallpapers · widgets that move with meaning · help for any age</p><div class="chips"><span style="color:#0CF2BA">Full</span><span style="color:#B6DFE2">Gentle</span><span style="color:#8E8FB5">Still</span></div></div>`]];
window.TOTAL=52;
window.frame=function(t){const s=SC.find(([a,b])=>t>=a&&t<b)||SC[SC.length-1];const [a,b,f]=s;const root=document.getElementById('root');root.innerHTML=f(t);
 root.style.opacity=Math.min(1,(t-a)/.45,(b-t)/.45+(s===SC[SC.length-1]?1:0));paintAll(t,root)};
frame(0);window.ready=1;
</script></body></html>
