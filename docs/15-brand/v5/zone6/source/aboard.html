'35':{k:'Make it yours 3 / 6 · wallpaper reacts',t:'The wallpaper knows what halo is doing',p:'The same colours that mean something in the app mean the same thing on your home screen: mint ripples while halo listens, mint links while it works, a soft Apricot glow from the bottom only when something needs you.',
