</style></head><body><div id="r"></div><script>

 r.innerHTML=`<div class="div">${ring}<div class="n">23</div><h1>The new look — Calm Dock, alive</h1><p>November 2026 → 2027. The bottom quarter is a clear, living dock: where you are, what you can do, where you can go — with a labelled ring and an island that changes shape with what halo is doing. Full index of this chapter:</p>
 <div class="idx">${L.map(([t,v,p,n])=>`<div class="${n?'new':''}"><b>${t}</b><span>${v}</span><i>${p}</i></div>`).join('')}</div></div>`}
if(k=='y27'){r.innerHTML=`<div class="div">${ring}<div class="n" style="color:var(--ap)">2027</div><h1>halo, quietly ahead</h1><p>Pack 7.4. First four fixes, so the app always opens and always looks right. Then five ideas that make halo feel like 2027 without becoming loud: it does whole jobs and stops where it matters, works outside the app, suggests one useful thing with a reason, shows where every answer came from, and follows you to your watch and glasses.</p>
 <div class="f"><div><b>Hand it to halo</b><span>A readable plan, hard stops for money, messages, deleting and posting, and a receipt where each step can be undone.</span></div><div><b>Outside the app</b><span>Status-bar chip, lock screen step, progress cut into the plan, circle anything to ask about it.</span></div><div><b>Next for you</b><span>One card at a time, at most three a day, always with “Why this?”. You choose how helpful.</span></div><div><b>Trust you can see</b><span>“On this phone” or “Used online · weather” on every answer. Privacy in numbers. Pause. Private chat.</span></div><div><b>Across your things</b><span>Follow me to the watch and glasses. Small OKs travel; money and deletes stay on the phone.</span></div><div><b>Same meanings</b><span>Mint = working/done · Apricot = needs you · lilac = help · red = error. Nothing new to learn.</span></div></div></div>`}
if(k=='t5'){r.innerHTML=`<div class="div">${ring}<div class="n" style="color:#FFE08A">7.5</div><h1>The toolkit, grown</h1><p>Four new tools for everyday life, thirteen new widgets, six more live wallpapers and four new functions. Same dock, same colours, same help on every page — just more you can do.</p>
 <div class="f"><div><b>HaloScan</b><span>Read small print aloud, scan documents, translate menus in place, ask “what’s this?”.</span></div><div><b>HaloPlanner</b><span>A calm week, plain events, add things just by saying them.</span></div><div><b>HaloRecord</b><span>Talks into words, then into decisions and to-dos. Never secret.</span></div><div><b>HaloSheets</b><span>Tables without formulas: add up with buttons, ask in plain words.</span></div><div><b>13 widgets · 6 wallpapers</b><span>Capture, plan, family, getting around. Wallpapers tied to weather, season and what got done.</span></div><div><b>Focus · Routines · Family · Magnifier</b><span>Calmer days, routines as sentences, a shared home, small print made big.</span></div></div></div>`}
if(k=='f8'){r.innerHTML=`<div class="div">${ring}<div class="n" style="color:var(--mint)">8.0</div><h1>The final upgrade</h1><p>The toolkit reaches every age and every part of the day: the new tools in Easy view and for Kids, HaloAlbum and HaloVault, widgets on the lock screen and by the bed, eighteen wallpapers that can change through the day, and functions for real family life. It ends with one map of everything halo can do.</p>
 <div class="f"><div><b>Every age</b><span>Easy Scan, Easy Planner, Kids “What is this?”, Kids “My day”.</span></div><div><b>Album & Vault</b><span>Find photos by memory, make a story; keep papers safe and know what ends soon.</span></div><div><b>Smarter widgets</b><span>Lock screen, bedside, smart stack, edit in place.</span></div><div><b>18 wallpapers</b><span>Six more, a schedule through the day, and one made from your photo.</span></div><div><b>Real life</b><span>Morning check-in, on the move, wind down, emergency info.</span></div><div><b>halo at a glance</b><span>Places, 11 tools, 22+ widgets, 18 wallpapers, all functions — and the four rules.</span></div></div></div>`}
