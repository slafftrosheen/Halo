name: Android hermetic emulator

# Deterministic instrumentation only. No physical glasses, no private credentials, no cloud AI.
#
# Kept in its own workflow so an emulator infrastructure hiccup cannot cancel or block the static
# and unit layers. The instrumentation process is retried at most once, and only for
# infrastructure failures: reproducible product failures are never retried (see
# tools/ci/run_instrumentation_with_retry.sh).

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false"

jobs:
  hermetic-emulator:
    name: Hermetic instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build instrumentation APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain

      - name: Run hermetic instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: chmod +x tools/ci/run_instrumentation_with_retry.sh && tools/ci/run_instrumentation_with_retry.sh

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermetic-instrumentation-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            build/ci/
          if-no-files-found: ignore
